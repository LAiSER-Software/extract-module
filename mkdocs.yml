site_name: LAiSER
site_description: >-
  Extract skills, knowledge and tasks from free text and align them to ESCO, O*NET,
  the Open Skills Network and the UK Skills Classification.
site_url: https://laiser-software.github.io/extract-module/
repo_url: https://github.com/LAiSER-Software/extract-module
repo_name: LAiSER-Software/extract-module
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2025 LAiSER &middot; BSD-3-Clause

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# Internal engineering notes live in docs/ for contributors but are not part of
# the published user documentation.
exclude_docs: |
  REFACTORING_GUIDE.md
  adding_batching_vllm.md
  v0.5_architecture.md
  requirements.txt

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - Guides:
      - Usage: usage.md
      - Model providers: providers.md
      - Reproducibility: reproducibility.md
      - Taxonomies: taxonomies.md
      - Examples: examples.md
      - Cookbook notebooks: cookbook.md
  - Reference:
      - API: reference.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true

# With `mkdocs build --strict` these warnings fail the build, so a broken link or
# a missing anchor is caught in the pull request instead of on the live site.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
