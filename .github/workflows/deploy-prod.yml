name: Deploy to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  deploy-prod:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/laiser

    permissions:
      id-token: write  # required for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(sed -n 's/^__version__ *= *"\(.*\)"/\1/p' laiser/__init__.py)
          echo "tag=${TAG} package=${PKG}"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match laiser.__version__ (${PKG})"
            exit 1
          fi

      - name: Build package
        run: |
          pip install build twine
          python -m build

      - name: Validate package
        run: twine check dist/*

      - name: Check distribution size against PyPI limit
        run: |
          # PyPI rejects any single file over 100 MiB with an opaque 400.
          LIMIT=104857600
          STATUS=0
          for f in dist/*; do
            SIZE=$(stat -c%s "$f")
            PCT=$((SIZE * 100 / LIMIT))
            echo "${f}: ${SIZE} bytes (${PCT}% of limit)"
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "::error::${f} is ${SIZE} bytes, over PyPI's ${LIMIT} byte per-file limit"
              STATUS=1
            elif [ "$PCT" -ge 90 ]; then
              echo "::warning::${f} is at ${PCT}% of PyPI's per-file limit"
            fi
          done
          exit $STATUS

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
