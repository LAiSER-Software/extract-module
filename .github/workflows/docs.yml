name: Docs

# Documentation lives in this repository, so it is reviewed and versioned with
# the code it describes. Every PR that could change it builds the site in strict
# mode; merges to main publish it to GitHub Pages.
on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "laiser/**"   # the API reference is generated from docstrings
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "laiser/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs toolchain
        run: pip install -r docs/requirements.txt

      - name: Build (strict)
        # Broken links, missing anchors and unresolved API references fail here.
        run: mkdocs build --strict

      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
